name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vibeeval
      POSTGRES_USER: vibeeval
      POSTGRES_PASSWORD: ci-only-password
      VIBEEVAL_RUN_DB_TESTS: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vibeeval
          POSTGRES_USER: vibeeval
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U vibeeval -d vibeeval"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements-db.txt
            backend/requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python formatting
        run: python -m black --check .
      - name: Lint Python
        run: python -m ruff check .
      - name: Run all tests against PostgreSQL
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Require at least 80 percent line coverage
        run: python -m coverage report
      - name: Apply migrations and check schema consistency
        run: |
          python -m alembic upgrade head
          python -m alembic current --check-heads
          python -m alembic check

  windows:
    name: Windows snapshot compatibility
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"
      VIBEEVAL_RUN_DB_TESTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-db.txt
      - name: Install database dependencies
        run: python -m pip install -r requirements-db.txt
      - name: Test database configuration without a database
        run: python -m unittest discover -s tests -p test_db_config.py -v
      - name: Test snapshot concurrency and path validation
        run: python -m unittest discover -s tests -p test_snapshot_storage.py -v

  compose:
    name: Compose service smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start PostgreSQL and Redis
        run: docker compose up -d --wait --wait-timeout 120
      - name: Check service connectivity
        run: |
          test "$(docker compose exec -T postgres psql -U vibeeval -d vibeeval -v ON_ERROR_STOP=1 -tAc 'SELECT 1;')" = "1"
          test "$(docker compose exec -T redis redis-cli ping)" = "PONG"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
